<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>25マス計算アプリ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>25マス計算アプリ</h1>
      </header>

      <section class="toolbar">
        <label>
          種類:
          <select id="modeSelect">
            <option value="add">足し算</option>
            <option value="sub">引き算</option>
            <option value="mul">掛け算</option>
          </select>
        </label>

        <label>
          時間(秒):
          <input id="timeLimitInput" type="number" min="30" max="600" value="180" />
        </label>

        <label>
          ユーザー名:
          <input id="usernameInput" type="text" placeholder="名前を入力" />
        </label>

        <button id="startBtn" class="primary">開始</button>
        <button id="resetBtn" class="secondary">リセット</button>
      </section>

      <section class="status">
        <div>正解数: <strong id="score">0</strong>/25</div>
        <div>残り時間: <strong id="timer">180</strong>秒</div>
      </section>

      <div class="grid-container">
        <div class="header-col" id="operationCell"></div>
        <div class="header-row" id="headerRow"></div>
        <div class="side-col" id="sideCol"></div>
        <div id="grid" class="grid" aria-live="polite"></div>
      </div>

      <div class="footer">
        <button id="checkBtn" class="primary">採点</button>
      </div>

      <section id="resultSection" class="result-section hidden">
        <div class="result-card">
          <h2 id="resultTitle"></h2>
          <div class="result-details">
            <div>正解数: <strong id="resultScore"></strong>/25</div>
            <div>タイム: <strong id="resultTime"></strong>秒</div>
          </div>
          <button id="registerBtn" class="primary hidden">ランキングに登録</button>
          <p id="registeredMsg" class="hidden success">✓ ランキングに登録されました</p>
        </div>
      </section>

      <section id="rankingSection" class="ranking-section">
        <h2>🏆 ランキング（25点満点のみ）</h2>
        <div id="rankingList" class="ranking-list">
          <p class="muted">まだランキング記録がありません</p>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
